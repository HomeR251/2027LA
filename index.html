const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.replace(/\s+/g,'').toUpperCase()),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},k,b64(P.d)));
  try{localStorage.setItem('la2027-pw',pw)}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const err=document.getElementById('err');err.textContent='解鎖中…';
  try{await open(document.getElementById('pw').value)}catch(x){err.textContent='密碼不對，再試一次'}
});
(async()=>{let s=null;try{s=localStorage.getItem('la2027-pw')}catch(e){}if(s){try{await open(s)}catch(e){try{localStorage.removeItem('la2027-pw')}catch(_){}}}})();
